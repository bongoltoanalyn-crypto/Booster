name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract and FORCE FIX to Java 17
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          for f in *.7z; do [ -e "$f" ] && 7z x "$f" -y; done
          PROJECT_DIR=$(find . -maxdepth 4 -name "settings.gradle*" | head -1 | xargs dirname)
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "--- BEFORE PATCH ---"
          cat app/build.gradle | tail -n 100
          echo "--- FORCE PATCHING ---"
          # Tanggalin lumang jvmTarget para walang conflict
          sed -i "/jvmTarget/d" app/build.gradle || true
          sed -i "/sourceCompatibility/d" app/build.gradle || true
          sed -i "/targetCompatibility/d" app/build.gradle || true
          # Idikit sa dulo yung tamang Java 17 config - OOVERRIDE LAHAT
          cat >> app/build.gradle << 'EOF'

          // --- AUTO-FIXED BY GITHUB ACTIONS TO JAVA 17 ---
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          echo "--- AFTER PATCH ---"
          cat app/build.gradle | tail -n 50

      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -maxdepth 4 -name "settings.gradle*" | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.10.2
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BossBooster-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
