name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract and Fix Project
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          ls -la
          for f in *.7z; do [ -e "$f" ] && 7z x "$f" -y; done
          PROJECT_DIR=$(find . -maxdepth 4 -name "settings.gradle*" | head -1 | xargs dirname)
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls -la
          echo "--- PATCHING JVM TARGET TO 17 ---"
          find . -name "*.gradle" -o -name "*.gradle.kts" | xargs ls -la
          # Patch Java version
          sed -i "s/VERSION_1_8/VERSION_17/g" app/build.gradle || true
          sed -i "s/VERSION_11/VERSION_17/g" app/build.gradle || true
          sed -i "s/VERSION_1_8/VERSION_17/g" build.gradle || true
          sed -i "s/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g" app/build.gradle || true
          sed -i "s/jvmTarget.*1.8/jvmTarget = '17'/g" app/build.gradle || true
          sed -i "s/jvmTarget.*11/jvmTarget = '17'/g" app/build.gradle || true
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle || true
          sed -i "s/JvmTarget.*1_8/JvmTarget.JVM_17/g" app/build.gradle || true
          # Show patched file
          cat app/build.gradle | grep -A 2 -B 2 "jvmTarget\|sourceCompat\|targetCompat\|VERSION" | head -n 100

      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -maxdepth 4 -name "settings.gradle*" | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.10.2
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BossBooster-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
