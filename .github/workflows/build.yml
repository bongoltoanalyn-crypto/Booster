name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract and Build APK
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          echo "--- Before ---"
          ls -la
          echo "--- Extracting .7z ---"
          for f in *.7z; do [ -e "$f" ] && 7z x "$f" -y; done
          ls -la
          PROJECT_DIR=$(find . -maxdepth 4 -type f -name "settings.gradle*" | head -1 | xargs dirname)
          echo "Project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          pwd
          ls -la
          # Upgrade to 8.10.2 - lagpas sa required 8.9
          gradle wrapper --gradle-version 8.10.2
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BossBooster-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
