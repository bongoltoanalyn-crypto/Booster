name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract and Build APK
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          ls -la
          for f in *.7z; do [ -e "$f" ] && 7z x "$f" -y; done
          PROJECT_DIR=$(find . -maxdepth 4 -name "settings.gradle*" | head -1 | xargs dirname)
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls -la
          gradle wrapper --gradle-version 8.10.2
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace > full_log.txt 2>&1 || true
          echo "========== TUNAY NA ERROR =========="
          cat full_log.txt | grep -i -A 30 "What went\|FAILURE\|ERROR\|Could not\|not found" | head -n 150
          echo "===================================="
          echo "Full log saved for upload"

      - name: Upload FULL LOG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: |
            **/full_log.txt
            full_log.txt

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BossBooster-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
