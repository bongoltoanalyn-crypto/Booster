name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract and Build APK
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          find . -name "*.7z" -exec 7z x {} \; -o -print
          ls -la
          PROJECT_DIR=$(find . -maxdepth 4 -type f -name "settings.gradle*" | head -1 | xargs dirname)
          echo "Project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          # Force Gradle 8.9 - ito yung kailangan ng project mo!
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BossBooster-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
